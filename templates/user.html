<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мой Доступ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .door-btn { font-size: 1.5rem; padding: 2rem 1rem; border-radius: 15px; }
    </style>
</head>
<body>
<div class="container mt-5" style="max-width: 500px;">
    <h3 class="text-center mb-4">Здравствуйте, {{ user.name }}</h3>
    
    <div class="d-flex flex-column gap-3">
        {% if doors %}
            {% for d in doors %}
            <button class="btn btn-primary door-btn shadow-sm" onclick="openDoor('{{ user.token }}', '{{ d.id }}')">
                Отрыть: {{ d.name }}
            </button>
            {% endfor %}
        {% else %}
            <div class="alert alert-warning text-center">У вас нет доступных дверей.</div>
        {% endif %}
    </div>
    
    <div id="statusMessage" class="mt-4 text-center fw-bold fs-5"></div>
</div>

<script>
    function openDoor(token, doorId) {
        const statusDiv = document.getElementById('statusMessage');
        statusDiv.innerHTML = '<span class="text-secondary">Отправка...</span>';
        
        fetch(`/u/${token}/open/${doorId}`, { method: 'POST' })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success') {
                    statusDiv.innerHTML = '<span class="text-success">Успешно открыто!</span>';
                } else {
                    statusDiv.innerHTML = `<span class="text-danger">${data.message}</span>`;
                }
                setTimeout(() => statusDiv.innerHTML = '', 3000);
            }).catch(() => statusDiv.innerHTML = '<span class="text-danger">Ошибка сети</span>');
    }
</script>
</body>
</html>
