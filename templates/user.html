<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мій Доступ</title>
    
    <!-- Фиолетовая фавиконка дома с замком (data:image/svg+xml) -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%238115D3'%3E%3Cpath d='M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L8 2.207l6.646 6.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293z'/%3E%3Cpath d='m8 3.293 4.72 4.72a3 3 0 0 0-2.709 3.248A2 2 0 0 0 9 13v2H3.5A1.5 1.5 0 0 1 2 13.5V9.293z'/%3E%3Cpath d='M13 9a2 2 0 0 0-2 2v1a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1v-1a2 2 0 0 0-2-2m0 1a1 1 0 0 1 1 1v1h-2v-1a1 1 0 0 1 1-1'/%3E%3C/svg%3E" type="image/svg+xml">
    
    <link href="/static/bootstrap.min.css?v=5" rel="stylesheet">
</head>
<body>
<div class="container mt-5" style="max-width: 500px;">
    <h3 class="text-center mb-4">Вітаємо, {{ user.name }}!</h3>
    
    <div class="d-flex flex-column gap-3">
        {% if doors %}
            {% for d in doors %}
            <button class="btn btn-primary fs-4 py-4 px-3 rounded shadow-sm d-flex align-items-center justify-content-center gap-2" onclick="openDoor('{{ user.token }}', '{{ d.id }}')">
                <span id="icon-{{ d.id }}">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" class="bi bi-door-closed-fill" viewBox="0 0 16 16">
                      <path d="M12 1a1 1 0 0 1 1 1v13h1.5a.5.5 0 0 1 0 1h-13a.5.5 0 0 1 0-1H3V2a1 1 0 0 1 1-1zm-2 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/>
                    </svg>
                </span>
                Відкрити: {{ d.name }}
            </button>
            {% endfor %}
        {% else %}
            <div class="alert text-bg-primary text-center">На жаль, у вас немає доступних дверей. :(</div>
        {% endif %}
    </div>
    
    <div id="statusMessage" class="mt-4 text-center fw-bold fs-5"></div>
</div>

<script>
    const iconClosed = `<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" class="bi bi-door-closed-fill" viewBox="0 0 16 16"><path d="M12 1a1 1 0 0 1 1 1v13h1.5a.5.5 0 0 1 0 1h-13a.5.5 0 0 1 0-1H3V2a1 1 0 0 1 1-1zm-2 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/></svg>`;
    const iconOpen = `<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" class="bi bi-door-open-fill" viewBox="0 0 16 16"><path d="M1.5 15a.5.5 0 0 0 0 1h13a.5.5 0 0 0 0-1H13V2.5A1.5 1.5 0 0 0 11.5 1H11V.5a.5.5 0 0 0-.57-.495l-7 1A.5.5 0 0 0 3 1.5V15zM11 2h.5a.5.5 0 0 1 .5.5V15h-1zm-2.5 8c-.276 0-.5-.448-.5-1s.224-1 .5-1 .5.448.5 1-.224 1-.5 1"/></svg>`;

    function openDoor(token, doorId) {
        const statusDiv = document.getElementById('statusMessage');
        const iconSpan = document.getElementById(`icon-${doorId}`);
        
        statusDiv.innerHTML = '<span class="text-secondary">Відправлення...</span>';
        
        fetch(`/u/${token}/open/${doorId}`, { method: 'POST' })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success') {
                    statusDiv.innerHTML = '<span class="text-success">Успішно відкрито!</span>';
                    if (iconSpan) iconSpan.innerHTML = iconOpen; 
                } else {
                    statusDiv.innerHTML = `<span class="text-danger">${data.message}</span>`;
                }
                setTimeout(() => {
                    statusDiv.innerHTML = '';
                    if (iconSpan) iconSpan.innerHTML = iconClosed; 
                }, 3000);
            }).catch(() => statusDiv.innerHTML = '<span class="text-danger">Помилка мережі</span>');
    }
</script>
</body>
</html>
